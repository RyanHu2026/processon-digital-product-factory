<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>思维导图产品工厂</title>
<style>
:root{font-family:Inter,"Segoe UI",system-ui,sans-serif;color:#202124;background:#f8fafd;--blue:#1a73e8;--ink:#202124;--muted:#697386;--line:#e1e5ed;--card:#fff;--green:#137333;--red:#b3261e}*{box-sizing:border-box}body{margin:0}.shell{display:grid;grid-template-columns:246px 1fr;min-height:100vh}.side{background:#fff;border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column}.brand{font-weight:750;letter-spacing:-.4px;font-size:18px;padding:8px 12px 26px}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500;margin-top:6px}.nav{border:0;background:transparent;text-align:left;padding:12px 14px;margin:3px 0;border-radius:12px;color:#4d5562;font-size:14px;cursor:pointer}.nav.active,.nav:hover{background:#e8f0fe;color:#174ea6}.hint{margin-top:auto;color:#8b94a3;font-size:12px;line-height:1.65;padding:12px}.main{padding:34px clamp(22px,5vw,72px);max-width:1500px;width:100%}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:25px}.eyebrow{color:var(--blue);font-size:12px;font-weight:700;letter-spacing:1px}.title{font-size:32px;letter-spacing:-1px;margin:7px 0}.sub{color:var(--muted);margin:0;line-height:1.65}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid #cbd2dd;background:#fff;border-radius:9px;padding:10px 15px;cursor:pointer;color:var(--ink);font-weight:650}.btn.primary{border-color:var(--blue);background:var(--blue);color:#fff}.btn:disabled{opacity:.55;cursor:not-allowed}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 5px 20px #1f3b5d08;padding:22px}.card h2{margin:0 0 7px;font-size:18px}.card p{color:var(--muted);font-size:13px;line-height:1.6}.field{margin:15px 0}.field label{display:block;font-size:12px;color:#5f6877;font-weight:700;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;border:1px solid #ccd3df;border-radius:9px;padding:11px 12px;font:inherit;background:#fff}.field textarea{min-height:170px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid #d4dbe5;border-radius:999px;padding:6px 10px;font-size:12px;cursor:pointer}.chip.on{border-color:#8ab4f8;background:#e8f0fe;color:#174ea6}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{text-align:left;padding:11px 8px;border-bottom:1px solid #edf0f4}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;background:#eef1f5;color:#5f6877;font-size:11px}.badge.ok{background:#e6f4ea;color:var(--green)}.badge.fail{background:#fce8e6;color:var(--red)}.notice{padding:11px 13px;border-radius:10px;background:#f1f5fb;color:#596579;font-size:12px;line-height:1.6;margin-top:12px}.progress{height:7px;background:#e8edf4;border-radius:5px;overflow:hidden;margin:12px 0}.bar{height:100%;background:var(--blue);width:0;transition:width .3s}.empty{padding:30px;text-align:center;color:#8a93a0;font-size:13px}.path{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:#536174;word-break:break-all}.hidden{display:none!important}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line);padding:12px;display:block}.brand{padding:7px 10px 12px}.nav{display:inline-block}.hint{display:none}.main{padding:24px 15px}.grid{grid-template-columns:1fr}.top{display:block}.actions{margin-top:15px}.row{grid-template-columns:1fr}}
</style></head>
<body><div class="shell"><aside class="side"><div class="brand">思维导图产品工厂<small>PROCESSON PRODUCT LAB</small></div><button class="nav active" data-view="work">工作台</button><button class="nav" data-view="generate">批量生成</button><button class="nav" data-view="history">任务记录</button><div class="hint">本地优先 · API Key 只保存在当前会话<br>OPML/TXT 导出状态：待 ProcessOn 导入验证</div></aside><main class="main"><div class="top"><div><div class="eyebrow">LOCAL DIGITAL PRODUCT PIPELINE</div><h1 class="title" id="pageTitle">工作台</h1><p class="sub" id="pageSub">把主题变成可审核、可导出的思维导图产品。</p></div><div class="actions"><button class="btn" id="refresh">刷新</button><button class="btn primary" id="newTask">新建批量任务</button></div></div><section id="workView"></section><section id="generateView" class="hidden"></section><section id="historyView" class="hidden"></section></main></div><script>
const $=s=>document.querySelector(s), api=async(path,opts={})=>{const r=await fetch(path,{headers:{'Content-Type':'application/json'},...opts});const d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d};let state={topics:[],batches:[],sessionId:null,selected:[],view:'work'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function nav(){document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));['work','generate','history'].forEach(v=>$('#'+v+'View').classList.toggle('hidden',state.view!==v));const meta={work:['工作台','把主题变成可审核、可导出的思维导图产品。'],generate:['批量生成','先用演示模式验证流程，再配置你的国内模型 API。'],history:['任务记录','查看批次状态、质量评分和输出文件。']}[state.view];$('#pageTitle').textContent=meta[0];$('#pageSub').textContent=meta[1];render();}
async function load(){const d=await api('/api/state');state.topics=d.topics;state.batches=d.batches;nav()}
function stats(){return `<div class="grid"><div class="card"><h2>生产概览</h2><p>当前本地工作区的内容生产状态。</p><div class="row"><div class="notice"><b>${state.topics.filter(x=>x.status==='待生成').length}</b><br>待生成</div><div class="notice"><b>${state.topics.filter(x=>x.status==='待审核').length}</b><br>待审核</div><div class="notice"><b>${state.topics.filter(x=>x.status==='失败').length}</b><br>失败</div><div class="notice"><b>${state.topics.filter(x=>x.status==='已导出').length}</b><br>已导出</div></div></div><div class="card"><h2>当前原则</h2><p>AI 生成只是草稿。每份作品都要经过结构检查、事实核验、人工审核，再决定是否导入 ProcessOn。</p><div class="notice">首版支持 OPML 和 TXT。ProcessOn 当前公开信息明确提到 POS/XMind；OPML/TXT 仍需你在客户端实际导入验证。</div></div></div>`}
function topicTable(){if(!state.topics.length)return '<div class="empty">还没有主题，点击“新建批量任务”开始。</div>';return `<table class="table"><thead><tr><th>主题</th><th>分类</th><th>状态</th><th>评分</th></tr></thead><tbody>${state.topics.slice(0,12).map(x=>`<tr><td>${esc(x.title)}</td><td>${esc(x.category)}</td><td><span class="badge ${x.status==='失败'?'fail':x.status==='待审核'?'ok':''}">${esc(x.status)}</span>${x.error?`<div class="path">${esc(x.error)}</div>`:''}</td><td>${x.quality_score??'—'}</td></tr>`).join('')}</tbody></table>`}
function renderWork(){$('#workView').innerHTML=stats()+`<div class="card" style="margin-top:18px"><h2>最近主题</h2><p>生成结果会保存在项目 data/outputs 目录，不会覆盖同名文件。</p>${topicTable()}</div>`}
function renderGenerate(){$('#generateView').innerHTML=`<div class="grid"><div class="card"><h2>1. 输入主题</h2><p>每行一个主题，也可以导入 TXT/CSV。当前先提供文本输入，确保最小闭环可运行。</p><div class="field"><label>主题列表</label><textarea id="topicInput" placeholder="市场营销学核心知识框架\n外贸业务员从询盘到出货\nAI Agent 入门学习路线"></textarea></div><div class="row"><div class="field"><label>领域分类</label><select id="category"><option>大学课程与考试复习</option><option>求职与职场工具</option><option>AI 工具与技能学习路线</option></select></div><div class="field"><label>目标读者</label><input id="audience" value="大学生与个人学习者"></div></div><div class="field"><label>作品深度</label><div class="chips"><span class="chip on" data-depth="标准">标准</span><span class="chip" data-depth="基础">基础</span><span class="chip" data-depth="进阶">进阶</span></div></div><button class="btn primary" id="addTopics">加入任务</button></div><div class="card"><h2>2. 模型配置</h2><p>API Key 仅保存在当前运行会话，关闭程序后需要重新填写。也可以先用演示模式生成真实 OPML/TXT 文件。</p><div class="field"><label><input type="checkbox" id="demo" checked> 使用演示模式（不调用外部模型）</label></div><div class="field"><label>API Base URL</label><input id="base" placeholder="https://api.example.com/v1"></div><div class="row"><div class="field"><label>模型 ID</label><input id="model" placeholder="deepseek-chat"></div><div class="field"><label>最大输出 Token</label><input id="tokens" value="6000" type="number"></div></div><div class="field"><label>API Key</label><input id="key" type="password" autocomplete="off"></div><div class="row"><div class="field"><label>超时时间（秒）</label><input id="timeout" value="90" type="number"></div><div class="field"><label>重试次数</label><input id="retries" value="1" type="number"></div></div><button class="btn" id="testModel">测试模型连接</button> <button class="btn primary" id="start">开始生成</button><div id="modelMsg"></div></div></div><div class="card" style="margin-top:18px"><h2>当前待处理主题</h2>${topicTable()}<div id="taskMsg"></div></div>`;bindGenerate()}
function config(){return {demo_mode:$('#demo').checked,base_url:$('#base').value.trim(),model:$('#model').value.trim(),api_key:$('#key').value,max_tokens:$('#tokens').value,timeout:$('#timeout').value,retries:$('#retries').value,temperature:.4}}
async function bindGenerate(){let depth='标准';document.querySelectorAll('[data-depth]').forEach(x=>x.onclick=()=>{depth=x.dataset.depth;document.querySelectorAll('[data-depth]').forEach(y=>y.classList.toggle('on',y===x))});$('#addTopics').onclick=async()=>{const titles=$('#topicInput').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);const unique=[...new Set(titles)];if(!unique.length)return alert('请先输入主题');await api('/api/topics',{method:'POST',body:JSON.stringify({topics:unique.map(title=>({title,category:$('#category').value,audience:$('#audience').value,difficulty:depth}))})});$('#topicInput').value='';await load();alert(`已加入 ${unique.length} 个主题`)};$('#testModel').onclick=async()=>{const msg=$('#modelMsg');msg.innerHTML='<div class="notice">正在测试模型并校验 JSON…</div>';try{const d=await api('/api/models/session',{method:'POST',body:JSON.stringify({config:config()})});state.sessionId=d.session_id;await api('/api/models/test',{method:'POST',body:JSON.stringify({session_id:state.sessionId})});msg.innerHTML='<div class="notice" style="color:var(--green)">模型连通性测试通过。</div>'}catch(e){msg.innerHTML=`<div class="notice" style="color:var(--red)">${esc(e.message)}</div>`}};$('#start').onclick=async()=>{const pending=state.topics.filter(x=>x.status==='待生成');if(!pending.length)return alert('请先加入主题');try{if(!state.sessionId){const d=await api('/api/models/session',{method:'POST',body:JSON.stringify({config:config()})});state.sessionId=d.session_id}const d=await api('/api/tasks',{method:'POST',body:JSON.stringify({topic_ids:pending.map(x=>x.id),session_id:state.sessionId,model_name:config().demo_mode?'演示模式':config().model})});$('#taskMsg').innerHTML=`<div class="notice">批次 ${d.batch_id} 已开始。请留在任务记录页查看进度。</div>`;state.view='history';nav();poll()}catch(e){$('#taskMsg').innerHTML=`<div class="notice" style="color:var(--red)">${esc(e.message)}</div>`}}}
function renderHistory(){const rows=state.batches.length?state.batches.map(x=>`<tr><td>${x.id}</td><td>${x.total}</td><td>${x.completed}/${x.total}</td><td>${x.failed}</td><td><span class="badge ${x.status==='已完成'?'ok':''}">${x.status}</span></td><td><button class="btn" data-zip="${x.id}">打包 ZIP</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty">暂无批次记录</td></tr>';$('#historyView').innerHTML=`<div class="card"><h2>批次记录</h2><p>生成过程单个主题失败不会中断整批任务。输出文件包括 content.json、quality-report.json、publish-materials.json、OPML 和 TXT。</p><table class="table"><thead><tr><th>批次</th><th>总数</th><th>完成</th><th>失败</th><th>状态</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table><div class="notice">ProcessOn 导入说明：本项目没有把 OPML/TXT 宣称为已兼容格式。请使用客户端实际导入一份文件后，再记录验证结果。</div></div>`;document.querySelectorAll('[data-zip]').forEach(b=>b.onclick=async()=>{const d=await api('/api/export-zip',{method:'POST',body:JSON.stringify({batch_id:b.dataset.zip})});alert('ZIP 已生成：'+d.path)})}
function render(){if(state.view==='work')renderWork();if(state.view==='generate')renderGenerate();if(state.view==='history')renderHistory()}
function poll(){setTimeout(async()=>{await load();if(state.batches.some(x=>x.status==='生成中'))poll()},1200)}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;nav()});$('#refresh').onclick=load;$('#newTask').onclick=()=>{state.view='generate';nav()};load().catch(e=>alert(e.message));
</script></body></html>
