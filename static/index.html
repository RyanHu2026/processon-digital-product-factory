body{background:#f3f3f1;color:var(--ink)}body:before{display:none}.shell{grid-template-columns:232px minmax(0,1fr)}.side{background:#ebece9;border-right:1px solid #d7d8d4;padding:26px 14px 18px;box-shadow:none}.brand{color:#202328;font-size:16px;letter-spacing:-.4px;padding:7px 13px 34px}.brand:before{display:none}.brand small{color:#888d92;letter-spacing:1.5px;font-size:9px;margin-top:8px}.nav{color:#676c72;border-radius:8px;padding:11px 12px;margin:3px 0;font-size:13px;text-indent:0;transition:background .16s ease,color .16s ease}.nav:before{display:none}.nav.active,.nav:hover{color:#202328;background:#dfe1de;box-shadow:none;transform:none}.nav.active{font-weight:700}.hint{color:#858a8f;border-top:1px solid #d5d6d2;padding:16px 12px 4px;margin-top:auto;font-size:11px}.main{padding:42px clamp(28px,5vw,74px) 70px;max-width:none}.top{max-width:1160px;margin:0 auto 30px;align-items:flex-end}.eyebrow{color:#69717a;font-size:10px;letter-spacing:1.8px;font-weight:700}.eyebrow:before{width:18px;height:1px;margin-right:8px;background:#69717a}.title{color:#202328;background:none;-webkit-text-fill-color:initial;font-size:36px;letter-spacing:-1.6px;margin:10px 0 8px}.sub{color:#777c83;font-size:13px}.actions{gap:8px}.btn{border:1px solid #d0d2cf;background:#fff;border-radius:7px;padding:10px 14px;color:#42474d;font-size:12px;font-weight:700;box-shadow:none;transition:background .16s ease,border-color .16s ease}.btn:hover{border-color:#aeb3b0;background:#f7f7f5;transform:none;box-shadow:none}.btn:active{transform:translateY(1px)}.btn.primary{border-color:#30353b;background:#30353b;color:#fff;box-shadow:none}.btn.primary:hover{background:#20252a;border-color:#20252a}.grid{max-width:1160px;gap:16px;align-items:start}.card,#workView>.card,#generateView>.card,#historyView>.card{max-width:1160px;width:100%;border:1px solid #deded9;border-radius:10px;background:#fff;box-shadow:0 2px 8px rgba(25,30,35,.035);backdrop-filter:none;padding:22px}.card h2{font-size:16px;letter-spacing:-.2px;margin-bottom:8px}.card p{font-size:12px;color:#7a7f85;line-height:1.7}.notice{border:1px solid #e4e5e1;background:#f7f7f5;border-radius:7px;color:#70767d;padding:13px 14px;box-shadow:none}.notice:hover{transform:none;box-shadow:none}.notice b{color:#30353b;font-size:25px;margin-bottom:6px}.field{margin:16px 0}.field label{color:#666c72;font-size:11px}.field input,.field select,.field textarea{border:1px solid #d5d7d4;background:#fff;border-radius:7px;padding:11px 12px;color:#30353b;box-shadow:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#7b8791;box-shadow:0 0 0 2px rgba(63,95,122,.12);background:#fff}.chip{border:1px solid #d7d9d6;background:#fff;border-radius:6px;color:#747a80;padding:7px 11px;box-shadow:none}.chip:hover,.chip.on{border-color:#697985;background:#eef1f1;color:#334b5c;box-shadow:none}.table{font-size:12px}.table th{color:#8a8f94;font-size:10px;letter-spacing:.7px}.table td{padding:13px 8px;color:#4c5258}.table tbody tr:hover{background:#fafaf8}.badge{border:1px solid #dfe0dd;background:#f5f5f3;color:#747a80}.badge.ok{border-color:#c7ddd1;background:#eef5f0;color:#2d6a4f}.badge.fail{border-color:#e5caca;background:#fbf0f0;color:#a43d3d}.progress{height:6px;background:#e5e6e2}.bar{background:#526d82;box-shadow:none}.path{color:#7e858c}.empty{padding:40px;color:#92979c}section:not(.hidden){animation:workspaceIn .2s ease both}@keyframes workspaceIn{from{opacity:.5;transform:translateY(3px)}to{opacity:1;transform:none}}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{padding:14px 12px}.brand{padding:7px 10px 15px}.nav{display:inline-block;margin:2px 1px;padding:9px 10px}.hint{display:none}.main{padding:28px 15px 48px}.top{display:block}.actions{margin-top:17px}.title{font-size:32px}.row{grid-template-columns:1fr}}
.chart-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.chart-option{border:1px solid var(--line);background:#fff;border-radius:8px;padding:12px;text-align:left;cursor:pointer;color:var(--ink);min-height:76px}.chart-option b,.chart-option small{display:block}.chart-option b{font-size:13px;margin-bottom:5px}.chart-option small{font-size:11px;color:var(--muted);line-height:1.4}.chart-option.selected{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue);background:#f4f7ff}.chart-option:hover{border-color:var(--blue)}@media(max-width:760px){.chart-options{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head>
<body><div class="shell"><aside class="side"><div class="brand">思维导图产品工厂<small>PROCESSON PRODUCT LAB</small></div><button class="nav active" data-view="work">工作台</button><button class="nav" data-view="generate">批量生成</button><button class="nav" data-view="history">任务记录</button><div class="hint">本地优先 · API Key 保存在 Windows 凭据管理器<br>输出 ProcessOn POS + XMind</div></aside><main class="main"><div class="top"><div><div class="eyebrow">LOCAL DIGITAL PRODUCT PIPELINE</div><h1 class="title" id="pageTitle">工作台</h1><p class="sub" id="pageSub">把主题变成可审核、可导出的思维导图产品。</p></div><div class="actions"><button class="btn" id="refresh">刷新</button><button class="btn primary" id="newTask">新建批量任务</button></div></div><section id="workView"></section><section id="generateView" class="hidden"></section><section id="historyView" class="hidden"></section></main></div><script>
const $=s=>document.querySelector(s), api=async(path,opts={})=>{const r=await fetch(path,{headers:{'Content-Type':'application/json'},...opts});const d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d};let state={topics:[],batches:[],outputDir:'',sessionId:null,selected:[],view:'work'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function nav(){document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));['work','generate','history'].forEach(v=>$('#'+v+'View').classList.toggle('hidden',state.view!==v));const meta={work:['工作台','把主题变成可审核、可导出的结构图产品。'],generate:['批量生成','先用演示模式验证流程，再配置你的国内模型 API。'],history:['任务记录','查看批次状态、质量评分和输出文件。']}[state.view];$('#pageTitle').textContent=meta[0];$('#pageSub').textContent=meta[1];render();}
async function load(){const d=await api('/api/state');state.topics=d.topics;state.batches=d.batches;state.outputDir=d.output_dir||'';nav()}
function stats(){return `<div class="grid"><div class="card"><h2>流程图生产概览</h2><p>当前本地工作区的流程图生成状态。</p><div class="row"><div class="notice"><b>${state.topics.filter(x=>x.status==='待生成').length}</b><br>待生成</div><div class="notice"><b>${state.topics.filter(x=>x.status==='待审核').length}</b><br>待审核</div><div class="notice"><b>${state.topics.filter(x=>x.status==='失败').length}</b><br>失败</div><div class="notice"><b>${state.topics.filter(x=>x.status==='已导出').length}</b><br>已导出</div></div></div><div class="card"><h2>当前原则</h2><p>AI 生成只是草稿。每份作品都要经过结构检查、事实核验、人工审核，再决定是否导入 ProcessOn。</p><div class="notice">每个主题同时输出 ProcessOn 原生 POS 和 XMind；非思维导图请优先导入 POS，避免被 XMind 导入器重排成单边脑图。</div></div></div>`}
function fileActions(x){if(!x.result_path)return '—';return `<button class="btn" data-show-path="${esc(x.result_path)}">查看文件路径</button> <button class="btn" data-open-path="${esc(x.result_path)}">打开存储位置</button>`}function topicTable(){if(!state.topics.length)return '<div class="empty">还没有主题，点击“新建批量任务”开始。</div>';return `<table class="table"><thead><tr><th>主题</th><th>图形类型</th><th>分类</th><th>难度</th><th>状态</th><th>评分</th><th>操作</th></tr></thead><tbody>${state.topics.slice(0,12).map(x=>`<tr><td>${esc(x.title)}</td><td><span class="badge">${esc(x.chart_type||'思维导图')}</span></td><td>${esc(x.category)}</td><td><span class="badge">${esc(x.difficulty||'标准')}</span></td><td><span class="badge ${x.status==='失败'?'fail':x.status==='待审核'?'ok':''}">${esc(x.status)}</span>${x.error?`<div class="path">${esc(x.error)}</div>`:''}</td><td>${x.quality_score??'—'}</td><td>${fileActions(x)}</td></tr>`).join('')}</tbody></table>`}
function fullOutputPath(path){const clean=String(path||'').replace(/\\/g,'/').replace(/^data\/outputs\//,'');return state.outputDir.replace(/\\/g,'/').replace(/\/$/,'')+'/'+clean}function bindFileActions(){document.querySelectorAll('[data-show-path]').forEach(b=>b.onclick=()=>alert('ProcessOn POS 文件路径：\n'+fullOutputPath(b.dataset.showPath)));document.querySelectorAll('[data-open-path]').forEach(b=>b.onclick=async()=>{try{await api('/api/open-location?path='+encodeURIComponent(b.dataset.openPath))}catch(e){alert(e.message)}})}function renderWork(){$('#workView').innerHTML=stats()+`<div class="card" style="margin-top:18px"><h2>最近主题</h2><p>结果默认指向 ProcessOn 原生 POS 文件；同目录仍保留 XMind 作为兼容备份。</p>${topicTable()}</div>`;bindFileActions()}
function renderGenerate(){$('#generateView').innerHTML=`<div class="grid"><div class="card"><h2>1. 输入主题</h2><p>每行一个主题，也可以导入 TXT/CSV。当前先提供文本输入，确保最小闭环可运行。</p><div class="field"><label>主题列表</label><textarea id="topicInput" placeholder="市场营销学核心知识框架\n外贸业务员从询盘到出货\nAI Agent 入门学习路线"></textarea></div><div class="row"><div class="field"><label>领域分类</label><select id="category"><option>大学课程与考试复习</option><option>求职与职场工具</option><option>AI 工具与技能学习路线</option></select></div><div class="field"><label>目标读者</label><input id="audience" value="大学生与个人学习者"></div></div><div class="field"><label>图形类型</label><div class="chart-options"><button type="button" class="chart-option selected" data-chart="思维导图"><b>思维导图</b><small>中心主题向外展开，适合知识梳理</small></button><button type="button" class="chart-option" data-chart="流程图"><b>流程图</b><small>步骤、判断、分支与结果</small></button><button type="button" class="chart-option" data-chart="鱼骨图"><b>鱼骨图</b><small>问题、原因分类与影响因素</small></button><button type="button" class="chart-option" data-chart="树状结构图"><b>树状结构图</b><small>根节点到分类层级</small></button><button type="button" class="chart-option" data-chart="双边思维导图"><b>双边思维导图</b><small>中心主题左右平衡展开</small></button><button type="button" class="chart-option" data-chart="组织结构图"><b>组织结构图</b><small>上级、部门与下属单元</small></button></div><div class="notice" id="chartHint">当前选择：思维导图。生成 POS，并保留 XMind；其他类型只生成 POS。</div></div><div class="field"><label>作品深度</label><div class="chips"><span class="chip on" data-depth="标准">标准</span><span class="chip" data-depth="基础">基础</span><span class="chip" data-depth="进阶">进阶</span></div></div><button class="btn primary" id="addTopics">加入任务</button></div><div class="card"><h2>2. 模型配置</h2><p>普通配置会自动保存；API Key 单独保存在 Windows 凭据管理器，页面不会回显密钥。首次填写后，之后打开程序无需重复配置。演示模式也会生成真实 POS 和 XMind 文件，但正式内容建议使用真实模型。</p><div class="field"><label><input type="checkbox" id="demo" checked> 使用演示模式（不调用外部模型）</label></div><div class="field"><label>API Base URL</label><input id="base" placeholder="https://api.deepseek.com"></div><div class="field"><label>模型 ID</label><input id="model" value="deepseek-chat" placeholder="deepseek-chat"></div><div class="field"><label>API Key</label><input id="key" type="password" autocomplete="new-password" placeholder="首次填写后安全保存"></div><div id="keyStatus" class="notice">正在读取安全存储状态…</div><div class="row"><div class="field"><label>超时时间（秒）</label><input id="timeout" value="90" type="number"></div><div class="field"><label>重试次数</label><input id="retries" value="1" type="number"></div></div><button class="btn" id="testModel">测试模型连接</button> <button class="btn primary" id="start">开始生成</button><div id="modelMsg"></div></div></div><div class="card" style="margin-top:18px"><h2>当前待处理主题</h2>${topicTable()}<div id="taskMsg"></div></div>`;bindGenerate()}
function config(){return {demo_mode:$('#demo').checked,base_url:$('#base').value.trim(),model:$('#model').value.trim(),api_key:$('#key').value,timeout:$('#timeout').value,retries:$('#retries').value,temperature:.4}}
async function bindGenerate(){let depth=localStorage.getItem('factoryDepth')||'标准';let chartType=localStorage.getItem('factoryChartType')||'思维导图';document.querySelectorAll('[data-depth]').forEach(x=>x.classList.toggle('on',x.dataset.depth===depth));document.querySelectorAll('[data-chart]').forEach(x=>x.classList.toggle('selected',x.dataset.chart===chartType));$('#chartHint').textContent='当前选择：'+chartType+'。'+(chartType==='思维导图'?'生成 POS，并保留 XMind。':'只生成 ProcessOn POS，不生成 XMind。');try{const saved=await api('/api/models/config');$('#base').value=saved.base_url||'';$('#model').value=saved.model||'';$('#timeout').value=saved.timeout||90;$('#retries').value=saved.retries||1;$('#demo').checked=saved.key_saved?false:saved.demo_mode;if(saved.key_saved)$('#keyStatus').textContent='API Key 已保存在 Windows 凭据管理器，已默认使用真实模型；页面不会显示密钥。';else $('#keyStatus').textContent='尚未保存 API Key；首次填写并保存后无需重复输入。'}catch(e){$('#keyStatus').textContent='暂时无法读取安全存储状态。'}document.querySelectorAll('[data-depth]').forEach(x=>x.onclick=()=>{depth=x.dataset.depth;localStorage.setItem('factoryDepth',depth);document.querySelectorAll('[data-depth]').forEach(y=>y.classList.toggle('on',y===x))});document.querySelectorAll('[data-chart]').forEach(x=>x.onclick=()=>{chartType=x.dataset.chart;localStorage.setItem('factoryChartType',chartType);document.querySelectorAll('[data-chart]').forEach(y=>y.classList.toggle('selected',y===x));$('#chartHint').textContent='当前选择：'+chartType+'。'+(chartType==='思维导图'?'生成 POS，并保留 XMind。':'只生成 ProcessOn POS，不生成 XMind。')});$('#addTopics').onclick=async()=>{const titles=$('#topicInput').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);const unique=[...new Set(titles)];if(!unique.length)return alert('请先输入主题');await api('/api/topics',{method:'POST',body:JSON.stringify({topics:unique.map(title=>({title,category:$('#category').value,audience:$('#audience').value,difficulty:depth,chart_type:chartType}))})});$('#topicInput').value='';await load();alert(`已加入 ${unique.length} 个主题`)};$('#testModel').onclick=async()=>{const msg=$('#modelMsg');msg.innerHTML='<div class="notice">正在测试模型并校验 JSON…</div>';try{const d=await api('/api/models/session',{method:'POST',body:JSON.stringify({config:config()})});state.sessionId=d.session_id;await api('/api/models/test',{method:'POST',body:JSON.stringify({session_id:state.sessionId})});msg.innerHTML='<div class="notice" style="color:var(--green)">模型连通性测试通过。</div>'}catch(e){msg.innerHTML=`<div class="notice" style="color:var(--red)">${esc(e.message)}</div>`}};$('#start').onclick=async()=>{const pending=state.topics.filter(x=>x.status==='待生成'||x.status==='失败');if(!pending.length)return alert('请先加入主题');try{if(!state.sessionId){const d=await api('/api/models/session',{method:'POST',body:JSON.stringify({config:config()})});state.sessionId=d.session_id}const d=await api('/api/tasks',{method:'POST',body:JSON.stringify({topic_ids:pending.map(x=>x.id),difficulty:depth,chart_type:chartType,session_id:state.sessionId,model_name:config().demo_mode?'演示模式':config().model})});$('#taskMsg').innerHTML=`<div class="notice">批次 ${d.batch_id} 已开始。请留在任务记录页查看进度。</div>`;state.view='history';nav();poll()}catch(e){$('#taskMsg').innerHTML=`<div class="notice" style="color:var(--red)">${esc(e.message)}</div>`}}}
function renderHistory(){const rows=state.batches.length?state.batches.map(x=>`<tr><td>${x.id}</td><td>${x.total}</td><td>${x.completed}/${x.total}</td><td>${x.failed}</td><td><span class="badge ${x.status==='已完成'?'ok':''}">${x.status}</span></td><td><button class="btn" data-zip="${x.id}">打包 ZIP</button> <button class="btn" data-open-batch="${x.id}">打开存储位置</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty">暂无批次记录</td></tr>';$('#historyView').innerHTML=`<div class="card"><h2>批次记录</h2><p>每个主题生成 ProcessOn POS、XMind 和配套 JSON；ZIP 仅用于批量归档。</p><table class="table"><thead><tr><th>批次</th><th>总数</th><th>完成</th><th>失败</th><th>状态</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table><div class="notice">ProcessOn 导入：非思维导图优先选择单个 .pos 文件；XMind 仅作为兼容备份。</div></div>`;document.querySelectorAll('[data-zip]').forEach(b=>b.onclick=async()=>{const d=await api('/api/export-zip',{method:'POST',body:JSON.stringify({batch_id:b.dataset.zip})});alert('ZIP 归档已生成：'+d.path+'\n\n解压后优先选择其中单个 .pos 文件导入 ProcessOn。')});document.querySelectorAll('[data-open-batch]').forEach(b=>b.onclick=async()=>{try{await api('/api/open-location?path='+encodeURIComponent('data/outputs/'+b.dataset.openBatch))}catch(e){alert(e.message)}})}
function render(){if(state.view==='work')renderWork();if(state.view==='generate')renderGenerate();if(state.view==='history')renderHistory()}
function poll(){setTimeout(async()=>{await load();if(state.batches.some(x=>x.status==='生成中'))poll()},1200)}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;nav()});$('#refresh').onclick=load;$('#newTask').onclick=()=>{state.view='generate';nav()};load().catch(e=>alert(e.message));
</script></body></html>
